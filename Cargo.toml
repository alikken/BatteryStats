[package]
name = "battery-stats"
version = "1.2.1"
authors = ["alikken"]
edition = "2021"

[[bin]]
name = "BatteryStats"
path = "src/main.rs"

[features]
devtools = []

[dependencies.windows-sys]
version = "0.59"
features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_UI_HiDpi",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_GdiPlus",
  "Win32_Graphics_Dwm",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_System_IO",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_System_Performance",
  "Win32_Globalization",
  "Win32_Storage_FileSystem",
  "Win32_Security",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
